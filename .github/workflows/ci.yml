name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    # Both, on purpose. Windows is where this ships, so the real platform
    # providers must be exercised there; Linux is where the core has to keep
    # building, because the Linux head is designed-for-later and a core that
    # quietly grew a Windows dependency would only be found out too late.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  publish:
    # What actually gets installed on a country server: two files, each with
    # the runtime inside it, needing nothing preinstalled. The service is the
    # product; the tray is what the technician sees, and it is published
    # beside it rather than inside it because the two run as different
    # accounts -- the service as LocalSystem with nobody logged on, the tray
    # in the technician's own session.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Separate folders: the tray's publish carries a few of the service
      # project's own artefacts along with it (it references that project),
      # and an installer should be given two clean directories rather than
      # one it has to pick apart.
      - run: dotnet publish src/AdlAgent.Windows/AdlAgent.Windows.csproj -c Release -r win-x64 -o publish/service

      - run: dotnet publish src/AdlAgent.Tray/AdlAgent.Tray.csproj -c Release -r win-x64 -o publish/tray

      - uses: actions/upload-artifact@v4
        with:
          name: adl-agent-win-x64
          path: publish/
