name: CI

on:
  push:
    branches: [main]
    # Without this a tag push matches nothing and the release job below --
    # which is the only thing that ever publishes agent-releases.json, and so
    # the only way any ADL instance learns a version exists -- can never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    # Both, on purpose. Windows is where this ships, so the real platform
    # providers must be exercised there; Linux is where the core has to keep
    # building, because the Linux head is designed-for-later and a core that
    # quietly grew a Windows dependency would only be found out too late.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  package:
    # What actually gets installed on a country server: the MSI, which
    # installs a Windows Service for a technician with administrator rights.
    #
    # Bare, with no switches, and that is the check rather than an omission --
    # PackagingScriptTests asserts this line carries no -WithPerUserTier. The
    # per-user tier of decision #262 is deferred: nothing has asked for it and
    # nothing has installed it, so no release carries one. See "the per-user
    # tier is not built" in the README.
    #
    # The script is `packaging/pack.ps1` rather than a list of steps here, so
    # that the packages an NMHS installs can be reproduced by a person on a
    # Windows machine exactly as this produced them. Working out what went
    # wrong with an install nobody can reach is hard enough without the build
    # existing only inside a CI file.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            # A tagged build is a release, and the tag is the version the
            # whole fleet will compare itself against.
            $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            # Anything else builds the version in the repository, so that a
            # pull request proves the packaging still works without minting a
            # version number that means nothing.
            $properties = [xml](Get-Content Directory.Build.props)
            $version = ($properties.Project.PropertyGroup.VersionPrefix).Trim()
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$version' is not three numbers. The update feed refuses anything else."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build the installers
        shell: pwsh
        run: ./packaging/pack.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: adl-agent-packages
          path: artifacts/

      # The bare programs as well: an installer is not the only way to try a
      # build, and a self-contained publish is what somebody debugging a
      # country's machine copies onto it.
      - uses: actions/upload-artifact@v4
        with:
          name: adl-agent-win-x64
          path: publish/

      # Whether Windows will actually run what was just packaged.
      #
      # Nothing above this line finds out. The tray's manifest is not read by
      # a compiler, its window is not automated, and the job builds an
      # installer around a program it never starts -- which is how a tray
      # that could not start at all was packaged, released and installed on a
      # country server before anyone knew. Starting it here is cheap and it
      # is the only step that would have said so.
      #
      # After the uploads on purpose: the job still fails, and the release
      # job still refuses to run, but the binary that would not start is
      # attached to the run for whoever has to work out why.
      - name: Prove the tray starts
        shell: pwsh
        run: ./packaging/verify-tray-starts.ps1

      # And whether Windows Installer does what the package says it does.
      #
      # The tests read the installer's sources and check the rule its screen
      # enforces against the rule the agent enforces; this installs the
      # package that was just built, on a real Windows machine, and reads the
      # file it wrote.
      #
      # The step that matters is the last one it does: a silent upgrade,
      # passed no properties, exactly as UpdateService performs it. That is
      # how every machine in every fleet replaces itself, unattended, and it
      # is the one thing here that could break all of them at once.
      - name: Prove the package installs and upgrades without forgetting
        shell: pwsh
        run: ./packaging/verify-msi-install.ps1

  release:
    # Publishing a version, once, in the one place every ADL instance
    # mirrors from.
    #
    # This is the seam between the two repositories: the index written here
    # is what `adl-agent-plugin`'s nightly mirror reads, and the digests in it
    # are what every agent in every fleet checks its download against before
    # installing it. Nothing downstream trusts anything that is not in here.
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: adl-agent-packages
          path: artifacts

      - name: Fetch the index this one supersedes
        # Best effort, and unremarkable when it fails: the first release has
        # no predecessor. Merging matters because an instance mirroring for
        # the first time should still be able to reach the version before
        # this one, which is what an operator pinning a machine one release
        # back needs to exist.
        run: |
          curl -fsSL -o previous.json \
            "https://github.com/${{ github.repository }}/releases/latest/download/agent-releases.json" \
            || echo "No previous index; this index starts the list."

      - name: Write the release index
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          TAG="${GITHUB_REF#refs/tags/}"

          python3 packaging/release-index.py \
            --artifacts artifacts \
            --version "$VERSION" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/$TAG" \
            --released-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes "ADL Agent $VERSION" \
            --previous previous.json \
            --output artifacts/agent-releases.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          gh release create "$TAG" \
            --title "ADL Agent ${TAG#v}" \
            --generate-notes \
            artifacts/*
